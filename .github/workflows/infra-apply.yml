name: infra · Aplicación

# Aplica el cambio ya revisado. Lo llama infra.yml; no se ejecuta solo.
#
#   4 · Base compartida ──> 5 · Staging ──> 6 · Producción
#   (aprobación)            (interruptor)   (interruptor + aprobación)
#
# Cada ambiente es el mismo stack de Terraform con su propio archivo de valores
# y su propio estado. Se enciende con una variable del repositorio:
#   STAGING_ENABLED = true   crea o actualiza staging
#   PROD_ENABLED    = true   crea o actualiza producción
on:
  workflow_call:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  PROJECT: nelua-api
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.16.4"

jobs:
  # ───────────────────────── Etapa 4 ─────────────────────────
  shared:
    name: 4 · Base compartida
    runs-on: ubuntu-24.04
    # El environment "infra" exige aprobación manual antes de aplicar.
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Lo que usan los dos ambientes: registro de imágenes, certificado y secretos.
      - name: Apply del stack persistent (ECR, certificado, secretos, contrato)
        run: |
          terraform -chdir=iac/stacks/persistent init -input=false
          terraform -chdir=iac/stacks/persistent apply -input=false -auto-approve

  # ───────────────────────── Etapa 5 ─────────────────────────
  staging:
    name: 5 · Staging
    needs: shared
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Apply de la plataforma (VPC, EKS, ALB, WAF, DNS, IAM, alarmas)
        run: |
          terraform -chdir=iac/stacks/platform init -input=false -backend-config=envs/staging.backend.hcl
          terraform -chdir=iac/stacks/platform apply -input=false -auto-approve -var-file=envs/staging.tfvars

      - name: Configuración del clúster (namespace, nodos, permisos, enlace con el ALB, monitoreo)
        run: bash iac/scripts/apply-k8s.sh staging

  # ───────────────────────── Etapa 6 ─────────────────────────
  prod:
    name: 6 · Producción
    needs: [shared, staging]
    if: ${{ !cancelled() && needs.shared.result == 'success' && needs.staging.result != 'failure' && vars.PROD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    # Producción pide su propia aprobación, aparte de la de la base compartida.
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Apply de la plataforma (VPC, EKS, ALB, WAF, DNS, IAM, alarmas)
        run: |
          terraform -chdir=iac/stacks/platform init -input=false -backend-config=envs/prod.backend.hcl
          terraform -chdir=iac/stacks/platform apply -input=false -auto-approve -var-file=envs/prod.tfvars

      - name: Configuración del clúster (namespace, nodos, permisos, enlace con el ALB, monitoreo)
        run: bash iac/scripts/apply-k8s.sh prod
