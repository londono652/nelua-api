name: app

# Pipeline de la aplicación. Este archivo solo orquesta: cada grupo vive en su
# propio workflow y aparece como un bloque en el gráfico de la ejecución.
#
#   ┌─ CI (app-ci.yml) ──────────────────────────┐   ┌─ CD (app-cd.yml) ──────────────────┐
#   │ 1 · Build y test ──┐                       │   │                                    │
#   │                    ├─> 3 · Build de imagen │──>│ 5 · Deploy a staging               │
#   │ 2 · Calidad y     ─┘   4 · Push al registry│   │ 6 · Deploy a producción            │
#   │     seguridad                              │   │     (cada uno con rollback)        │
#   └────────────────────────────────────────────┘   └────────────────────────────────────┘
#
# Pull request -> CI sin publicar la imagen (etapas 1 a 3).
# Push a main  -> CI completo y, si staging está encendido, CD.
on:
  pull_request:
    paths:
      - "api/**"
      - "cicd/**"
      - ".github/workflows/app*.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "cicd/**"
      - ".github/workflows/app*.yml"
  workflow_dispatch:

permissions:
  contents: read

# Evita dos ejecuciones simultáneas de la misma rama.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/app-ci.yml
    permissions:
      id-token: write # el job de push se autentica en AWS por OIDC
      contents: read

  cd:
    name: CD
    needs: ci
    # Interruptor: solo se despliega desde main y con staging encendido.
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/app-cd.yml
    permissions:
      id-token: write
      contents: read
    with:
      image_tag: ${{ github.sha }}
