name: ops-down

# Apaga un ambiente: destruye su stack platform (EKS, nodos, VPC, NAT, ALB, WAF
# y registro DNS). No toca la base compartida: se conservan imágenes,
# certificado, secretos y estado.
#
# Después de usarlo, deja la variable del ambiente (STAGING_ENABLED o
# PROD_ENABLED) en false para que el pipeline de infra no lo vuelva a crear.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a destruir
        type: choice
        options: [staging, prod]
        default: staging
        required: true

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PROJECT: nelua-api
  TF_IN_AUTOMATION: "true"
  TARGET_ENVIRONMENT: ${{ inputs.environment }}

jobs:
  destroy:
    name: Destruir ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # Primero se retiran las cargas y el pool de nodos, para que EKS Auto Mode
      # termine sus instancias antes de borrar el clúster y la red.
      - name: Vaciar el clúster
        continue-on-error: true
        run: |
          cluster=$(aws ssm get-parameter --name "/$PROJECT/$TARGET_ENVIRONMENT/eks/cluster-name" \
            --query Parameter.Value --output text)
          aws eks update-kubeconfig --name "$cluster"
          helm uninstall nelua-api --namespace nelua-api --ignore-not-found --wait
          helm uninstall kube-prometheus-stack --namespace monitoring --ignore-not-found --wait
          kubectl delete namespace loadtest --ignore-not-found --wait --timeout=5m
          kubectl delete -f iac/k8s/nodepool.yaml --ignore-not-found --wait --timeout=10m

      # El balanceador de producción está protegido contra borrado: para destruir
      # ese ambiente hay que apagar antes alb_deletion_protection y aplicar.
      - name: terraform destroy
        run: |
          terraform -chdir=iac/stacks/platform init -input=false \
            -backend-config="envs/$TARGET_ENVIRONMENT.backend.hcl"
          terraform -chdir=iac/stacks/platform destroy -input=false -auto-approve \
            -var-file="envs/$TARGET_ENVIRONMENT.tfvars"
