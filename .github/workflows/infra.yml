name: infra

# Pipeline de infraestructura. Este archivo solo orquesta: cada grupo vive en su
# propio workflow y aparece como un bloque en el gráfico de la ejecución.
#
#   ┌─ Revisión (infra-review.yml) ──┐   ┌─ Aplicación (infra-apply.yml) ─────────────────────────┐
#   │ 1 · Validación ─┐              │   │                                                        │
#   │                 ├─> 3 · Plan   │──>│ 4 · Base compartida ─> 5 · Staging ─> 6 · Producción   │
#   │ 2 · Seguridad  ─┘              │   │ (aprobación)           (interruptor)  (interruptor)    │
#   └────────────────────────────────┘   └────────────────────────────────────────────────────────┘
#
# Pull request -> solo Revisión; el plan se publica como comentario.
# Push a main  -> Revisión y, tras aprobación manual, Aplicación.
on:
  pull_request:
    paths:
      - "iac/**"
      - ".github/workflows/infra*.yml"
  push:
    branches: [main]
    paths:
      - "iac/**"
      - ".github/workflows/infra*.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos ejecuciones de Terraform a la vez sobre la misma infraestructura.
concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  review:
    name: Revisión
    uses: ./.github/workflows/infra-review.yml
    permissions:
      id-token: write # autenticación en AWS por OIDC (para el plan)
      contents: read
      pull-requests: write # publicar el plan como comentario

  apply:
    name: Aplicación
    needs: review
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/infra-apply.yml
    permissions:
      id-token: write
      contents: read
