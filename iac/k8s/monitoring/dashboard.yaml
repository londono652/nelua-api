  "data": {
    "nelua-api.json": "{\n  \"uid\": \"nelua-api\",\n  \"title\": \"nelua-api\",\n  \"tags\": [\n    \"nelua\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"10s\",\n  \"time\": {\n    \"from\": \"now-30m\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"datasource\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n        \"label\": \"Fuente de datos\",\n        \"current\": {}\n      },\n      {\n        \"name\": \"namespace\",\n        \"type\": \"custom\",\n        \"label\": \"Entorno\",\n        \"query\": \"prod,staging\",\n        \"options\": [\n          {\n            \"text\": \"prod\",\n            \"value\": \"prod\",\n            \"selected\": true\n          },\n          {\n            \"text\": \"staging\",\n            \"value\": \"staging\",\n            \"selected\": false\n          }\n        ],\n        \"current\": {\n          \"text\": \"prod\",\n          \"value\": \"prod\"\n        }\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Peticiones por segundo\",\n      \"description\": \"\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"$namespace\\\"}[1m]))\",\n          \"legendFormat\": \"RPS\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Latencia p95\",\n      \"description\": \"\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 6,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\\\"$namespace\\\"}[1m])))\",\n          \"legendFormat\": \"p95\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Errores 5xx\",\n      \"description\": \"\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"$namespace\\\",status=~\\\"5..\\\"}[1m])) / sum(rate(http_requests_total{namespace=\\\"$namespace\\\"}[1m]))\",\n          \"legendFormat\": \"errores\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Pods de la API\",\n      \"description\": \"\",\n      \"type\": \"stat\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 5\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"kube_deployment_status_replicas_ready{namespace=\\\"$namespace\\\",deployment=\\\"nelua-api\\\"}\",\n          \"legendFormat\": \"listos\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      }\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Peticiones por segundo, por código de respuesta\",\n      \"description\": \"Tráfico que atiende la API, según sus propias métricas.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 5,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (status) (rate(http_requests_total{namespace=\\\"$namespace\\\"}[1m]))\",\n          \"legendFormat\": \"{{status}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Latencia (p50, p95, p99)\",\n      \"description\": \"\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 5,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\\\"$namespace\\\"}[1m])))\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\\\"$namespace\\\"}[1m])))\",\n          \"legendFormat\": \"p95\"\n        },\n        {\n          \"refId\": \"C\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\\\"$namespace\\\"}[1m])))\",\n          \"legendFormat\": \"p99\"\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Escalado de pods (HPA)\",\n      \"description\": \"Pods que el HPA pide frente a los que ya están atendiendo.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 13,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"kube_horizontalpodautoscaler_status_desired_replicas{namespace=\\\"$namespace\\\",horizontalpodautoscaler=\\\"nelua-api\\\"}\",\n          \"legendFormat\": \"deseados\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"kube_deployment_status_replicas_ready{namespace=\\\"$namespace\\\",deployment=\\\"nelua-api\\\"}\",\n          \"legendFormat\": \"listos\"\n        },\n        {\n          \"refId\": \"C\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"kube_horizontalpodautoscaler_spec_max_replicas{namespace=\\\"$namespace\\\",horizontalpodautoscaler=\\\"nelua-api\\\"}\",\n          \"legendFormat\": \"máximo\"\n        }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Uso de CPU por pod (% de lo solicitado)\",\n      \"description\": \"El HPA escala cuando el promedio supera el 60 %.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 13,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"$namespace\\\",container=\\\"api\\\"}[1m])) / sum by (pod) (kube_pod_container_resource_requests{namespace=\\\"$namespace\\\",container=\\\"api\\\",resource=\\\"cpu\\\"})\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ]\n    },\n    {\n      \"id\": 9,\n      \"title\": \"Nodos del clúster\",\n      \"description\": \"EKS Auto Mode agrega nodos cuando hay pods que no caben.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 21,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"count(kube_node_info)\",\n          \"legendFormat\": \"nodos\"\n        }\n      ]\n    },\n    {\n      \"id\": 10,\n      \"title\": \"Peticiones por segundo, por pod\",\n      \"description\": \"Reparto de la carga entre los pods.\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 21,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"${datasource}\"\n          },\n          \"expr\": \"sum by (pod) (rate(http_requests_total{namespace=\\\"$namespace\\\"}[1m]))\",\n          \"legendFormat\": \"{{pod}}\"\n        }\n      ]\n    }\n  ]\n}"
  }
