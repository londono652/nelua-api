# Dashboard de Grafana para la API (lo carga el sidecar de Grafana por la etiqueta grafana_dashboard).
# Generado como JSON; YAML es un superconjunto de JSON, así que kubectl lo aplica directamente.
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "nelua-api-dashboard",
    "namespace": "monitoring",
