# Permisos del recolector dentro del clúster: SOLO lectura, y solo de lo que
# la API expone. Los pods de la API no tienen ningún permiso sobre Kubernetes:
# leen lo que el recolector deja en DynamoDB.
#
# Los define infraestructura y no el chart de la aplicación: el pipeline de la
# app no puede crear ni ampliar roles, así que la aplicación no puede darse más
# permisos a sí misma en un despliegue.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nelua-api-workloads-reader
  namespace: nelua-api
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
---
# Las cargas se leen solo en el namespace de la aplicación, no en kube-system
# ni en monitoring. Para vigilar otro namespace se agrega aquí un RoleBinding
# en ese namespace (y el namespace en watchNamespaces del chart).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nelua-api-workloads-reader
  namespace: nelua-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nelua-api-workloads-reader
subjects:
  - kind: ServiceAccount
    name: nelua-api-collector
    namespace: nelua-api
