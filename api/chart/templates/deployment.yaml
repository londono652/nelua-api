apiVersion: apps/v1
kind: Deployment
metadata:
  name: nelua-api
  labels:
    {{- include "nelua-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nelua-api.selectorLabels" . | nindent 6 }}
  # Despliegue sin caída: primero sube pods nuevos, y solo retira los viejos
  # cuando los nuevos ya están listos.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "nelua-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: nelua-api
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Reparte los pods entre zonas: si cae una zona, las otras siguen atendiendo.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "nelua-api.selectorLabels" . | nindent 14 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            {{- include "nelua-api.commonEnv" . | nindent 12 }}
            - name: SNAPSHOT_REFRESH_SECONDS
              value: {{ .Values.snapshotRefreshSeconds | quote }}
            {{- if .Values.apiKeys.secretId }}
            # Solo el nombre del secreto: la API lo lee de Secrets Manager con
            # su propia identidad. La llave no pasa por el chart ni por el pipeline.
            - name: API_KEYS_SECRET_ID
              value: {{ .Values.apiKeys.secretId | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # startup: espera a que la app arranque antes de evaluar las otras dos.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # readiness: si falla, el pod sale del balanceo (no se reinicia).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # liveness: si falla, Kubernetes reinicia el contenedor.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
