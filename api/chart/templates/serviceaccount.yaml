# Una identidad por componente, cada una con lo mínimo que necesita:
#   nelua-api            (API)         credenciales de AWS para leer DynamoDB y
#                                      sus API keys. Sin permisos en Kubernetes.
#   nelua-api-collector  (recolector)  lee el clúster (iac/k8s/rbac.yaml),
#                                      escribe en DynamoDB y lee el token de GitHub.
# Los permisos de AWS llegan por EKS Pod Identity (iac/stacks/platform/iam_api.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  # Nombre fijo: es el que referencia la asociación de Pod Identity.
  name: nelua-api
  labels:
    {{- include "nelua-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if .Values.collector.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # Nombre fijo: lo referencian el RBAC y la asociación de Pod Identity.
  name: nelua-api-collector
  labels:
    {{- include "nelua-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
{{- end }}
