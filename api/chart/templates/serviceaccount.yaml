# Identidad del pod. Con ella:
#   - lee el estado del clúster (permisos de solo lectura definidos en iac/k8s/rbac.yaml)
#   - obtiene credenciales temporales de AWS (EKS Pod Identity, iac/stacks/platform/iam_api.tf)
apiVersion: v1
kind: ServiceAccount
metadata:
  # Nombre fijo: es el que referencian el RBAC y la asociación de Pod Identity.
  name: nelua-api
  labels:
    {{- include "nelua-api.labels" . | nindent 4 }}
