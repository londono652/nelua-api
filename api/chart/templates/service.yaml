apiVersion: v1
kind: Service
metadata:
  # Nombre fijo: es el que referencia el TargetGroupBinding del lado de infraestructura.
  name: nelua-api
  labels:
    {{- include "nelua-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nelua-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
