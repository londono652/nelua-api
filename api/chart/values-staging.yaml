# Staging: mismo chart y misma imagen que producción, con menos réplicas.
environment: staging

autoscaling:
  minReplicas: 2
  maxReplicas: 4

nodeSelector:
  kubernetes.io/arch: arm64

# En staging el tráfico es el de las pruebas: se guardan todas las trazas.
tracing:
  enabled: true
  api:
    sampleRatio: "1.0"
