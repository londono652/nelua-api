environment: prod

# El mínimo cubre el tráfico que puede llegar mientras el clúster escala; el
# máximo sale de la prueba de carga (RPS que soporta un pod, para 10.000 RPS
# más margen).
autoscaling:
  minReplicas: 3
  maxReplicas: 30

nodeSelector:
  kubernetes.io/arch: arm64

# 0,1 %: unas 10 trazas por segundo en el pico de 10.000 RPS.
tracing:
  enabled: true
  api:
    sampleRatio: "0.001"
